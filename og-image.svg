      <text x="437" y="532" text-anchor="middle" fill="#884e3c">Starter brand kit</text>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="774" y="82" font-size="13" font-weight="700" fill="#d2f26b">RegulAI guide</text>
    <text x="1128" y="82" text-anchor="end" font-size="12" fill="#9eb1a5">Usually replies instantly</text>
