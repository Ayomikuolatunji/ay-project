<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">RegulAI — Register the business. Build the brand.</title>
  <desc id="description">A clearer path from business idea to Nigerian business registration and a starter brand kit.</desc>
  <rect width="1200" height="630" fill="#f4f5ef" />
  <rect x="720" width="480" height="630" fill="#132b29" />
  <circle cx="1108" cy="82" r="122" fill="#1c3c37" />
  <circle cx="1090" cy="562" r="176" fill="#193530" />
  <path d="M720 0h-54c56 110 82 213 82 315s-26 205-82 315h54c51-99 76-204 76-315S771 99 720 0Z" fill="#e7ecdf" opacity=".58" />

  <g font-family="Arial, Helvetica, sans-serif">
