    <circle cx="1055" cy="260" r="15" fill="#132b29" />
    <text x="1055" y="265" text-anchor="middle" font-size="16" font-weight="700" fill="#d2f26b">↑</text>

    <rect x="774" y="340" width="354" height="184" rx="18" fill="#1c3c37" stroke="#3b5a50" />
