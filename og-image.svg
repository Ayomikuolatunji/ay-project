    <text x="1032" y="119" font-size="12" fill="#d2f26b">Secure session</text>

    <rect x="774" y="156" width="354" height="150" rx="18" fill="#f4f5ef" />
    <circle cx="812" cy="195" r="19" fill="#d2f26b" />
