    <text x="72" y="250" font-family="Georgia, serif" font-size="58" letter-spacing="-2.4" fill="#132b29">Register the</text>
    <text x="72" y="316" font-family="Georgia, serif" font-size="58" letter-spacing="-2.4" fill="#132b29">business.</text>
    <text x="72" y="382" font-family="Georgia, serif" font-size="58" font-style="italic" letter-spacing="-2.4" fill="#132b29">Build the brand.</text>

    <text x="74" y="432" font-size="17" fill="#5f736a">A guided first mile for entrepreneurs</text>
    <text x="74" y="456" font-size="17" fill="#5f736a">turning a business idea into a clearer next step.</text>

