    <path d="M806 468v25" stroke="#5d7a6d" stroke-width="2" />
    <circle cx="806" cy="512" r="8" fill="#f18e66" />
    <text x="824" y="517" font-size="14" fill="#b9c8bc">Documents next</text>
    <text x="1100" y="568" text-anchor="end" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#d2f26b">From idea to official</text>
